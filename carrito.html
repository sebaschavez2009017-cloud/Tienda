<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAMP | Box</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

header{
    background:#000;
    color:#fff;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
}

main{
    max-width:1200px;
    margin:auto;
    padding:50px 20px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.contenedor{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

.lista{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.producto{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:20px 0;
}

.resumen{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    height:fit-content;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
}

.pagar{
    background:black;
    color:white;
}

.vaciar{
    background:#ddd;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:60px;
}

#btnPagar{
    background:black;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    font-size:16px;
}

#btnPagar:hover{
    opacity:0.8;
}

</style>
</head>

<body>

<header>
<div class="logo">BAMP 📦</div>
</header>

<main>

<h1>Mi Box</h1>

<div id="listaCarrito"></div>

<div class="contenedor">

<div class="lista" id="listaProductos">

</div>

<div class="resumen">

<button id="btnPagar" onclick="pagar()">
    Pagar ahora
</button>

<h1 id="total">$0 MXN</h1>

<h3>Dirección de envío</h3>

<input placeholder="Escriba su dirección">

<script>
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

let lista = document.getElementById("listaProductos");
let total = 0;

lista.innerHTML = "";

carrito.forEach(producto => {
    lista.innerHTML += `
        <div style="background:white; color:black; padding:15px; margin-bottom:10px; border-radius:10px;">
            <h3>${producto.nombre}</h3>
            <p>Precio: $${producto.precio} MXN</p>
        </div>
    `;

    total += Number(producto.precio);
});

document.getElementById("total").textContent = "$" + total + " MXN";
</script>

<script>
    function pagar() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    if (carrito.length === 0) {
        alert("Tu carrito está vacío");
        return;
    }

    let total = carrito.reduce((t, p) => t + (p.precio * p.cantidad), 0);

    alert("Pago realizado con éxito 💰 Total: $" + total);

    // vaciar carrito después de pagar
    localStorage.removeItem("carrito");

    location.reload();
}
</script>

</body>
</html>
